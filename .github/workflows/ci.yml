name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruebas:
    name: pruebas (pytest, CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Dependencias
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install -r requirements-docker.txt pytest
      - name: Pruebas de humo
        run: pytest -q tests/

  docker:
    name: build de la imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t pengwin-dashboard:ci .
